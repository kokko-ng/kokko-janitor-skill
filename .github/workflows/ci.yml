name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Covers ruff lint + format (Dependabot bumps the ruff-pre-commit rev),
  # markdownlint, shellcheck, JSON validity, shebang/executable-bit
  # consistency, and whitespace hygiene.
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pre-commit on all files
        run: |
          pip install -r requirements-dev.txt
          pre-commit run --all-files --show-diff-on-failure

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint GitHub workflow files
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run test suite
        run: |
          pip install -r requirements-dev.txt
          pytest tests/ -q

  validate-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The janitor drives kokko-code-quality's check skills by name; a
      # checkout of kokko-skills lets check-cross-repo-refs.sh prove every
      # citation still resolves.
      - uses: actions/checkout@v4
        with:
          repository: kokko-ng/kokko-skills
          path: .kokko-skills
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate every plugin manifest
        run: |
          status=0
          for dir in plugins/*/; do
            echo "::group::claude plugin validate $dir"
            claude plugin validate "$dir" || status=1
            echo "::endgroup::"
          done
          exit "$status"
      - name: Check marketplace.json is in sync with plugin manifests
        run: bash scripts/check-marketplace-sync.sh
      - name: Lint skill and agent prompt files
        run: bash scripts/lint-prompts.sh
      - name: Check every namespaced skill and agent citation resolves
        run: bash scripts/check-cross-repo-refs.sh .kokko-skills
      - name: Check every hooks.json command resolves to an executable file
        run: |
          status=0
          for hooks_json in plugins/*/hooks/hooks.json; do
            [ -f "$hooks_json" ] || continue
            plugin_root=$(dirname "$(dirname "$hooks_json")")
            while IFS= read -r cmd; do
              resolved=${cmd//"\${CLAUDE_PLUGIN_ROOT}"/$plugin_root}
              if [ ! -f "$resolved" ]; then
                echo "ERROR: $hooks_json -> '$cmd' does not resolve to a file ($resolved)"
                status=1
              elif [ ! -x "$resolved" ]; then
                echo "ERROR: $hooks_json -> $resolved is not executable"
                status=1
              fi
            done < <(jq -r '.hooks | to_entries[] | .value[] | .hooks[] | .command' "$hooks_json")
          done
          exit "$status"
