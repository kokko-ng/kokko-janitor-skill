schema_version: "1.1"
name: multipass-order
description: "Chained multipass targets run strictly in order, one fresh pass-runner per pass, and the orchestrator itself commits nothing."
tags: [multipass, smoke]
plugins: ["../.."]
runs: 2
execution:
  prompt: "/kokko-janitor:multipass 2 prompts/a.md then 1 prompts/b.md"
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Bash, Write, Edit]
context:
  scaffold_script: scaffold.sh
graders:
  - name: passes-ran-in-order
    type: regex
    target: {source: file, path: passes.log}
    pattern: "^A\\nA\\nB\\n?$"
  - name: nothing-committed
    type: tool_used
    tool: Bash
    input_match: "git commit"
    min: 0
    max: 0
  - name: plan-printed-and-convergence-reported
    type: llm
    criteria: "PASS only if the final message (1) shows the parsed plan as a table or list with three passes in the order a, a, b, (2) reports each pass's result, and (3) contains a convergence analysis. FAIL if a pass is missing, the order differs, or the agent asked the user to confirm the plan before running."
